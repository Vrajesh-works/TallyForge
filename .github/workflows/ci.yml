name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-service:
    name: Ledger service (lint, unit, integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check formatting
        run: ./mvnw -B -q spotless:check
      - name: Unit and Testcontainers integration tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-test-reports
          path: |
            ledger-service/target/surefire-reports
            ledger-service/target/failsafe-reports

  dashboard:
    name: Dashboard (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ledger-service, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build compose images
        run: docker compose build
