# One-command local stack: docker compose up --build
# Dashboard: http://localhost:3000  API: http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tallyforge
      POSTGRES_USER: tallyforge
      POSTGRES_PASSWORD: tallyforge
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallyforge -d tallyforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 30

  ledger:
    build: ./ledger-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tallyforge
      DB_USER: tallyforge
      DB_PASSWORD: tallyforge
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      - ledger

volumes:
  pgdata:
