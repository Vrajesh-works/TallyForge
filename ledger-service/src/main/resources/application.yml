spring:
  application:
    name: tallyforge-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tallyforge}
    username: ${DB_USER:tallyforge}
    password: ${DB_PASSWORD:tallyforge}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

tallyforge:
  topics:
    ledger-events: tallyforge.ledger.events
    webhooks-dlq: tallyforge.webhooks.dlq
  outbox:
    relay-enabled: true
    poll-interval-ms: 200
  webhooks:
    dispatcher-enabled: true
    max-attempts: 6
    base-delay: PT2S
    max-delay: PT10M
    timeout: PT5S
    poll-interval-ms: 500
